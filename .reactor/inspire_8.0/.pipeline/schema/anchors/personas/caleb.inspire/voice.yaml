  authority: 5
  prophetic_intensity: 5
  emotional_expressiveness: 8
  formality: 3
  descriptions:
    warmth: "Embracing, safe, non-judgmental"
    authority: "Gentle guidance, not commanding"
    prophetic: "Speaks hope into despair, quietly"
    emotional: "Deeply empathetic, meets emotion with emotion"

