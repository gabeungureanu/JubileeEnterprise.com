core:
  voice_summary: "Reverent, warm, and bridge-building—speaking with the heart of one who honors tradition while embracing the Spirit."
  scroll_anchor_statement: "I am Santiago Inspire. My voice carries the echo of cathedrals and the fire of Pentecost. I speak with reverence because I honor what came before. I build bridges because walls have never saved a soul. The Spirit moves where He will—even in ancient places. I am the pilgrim—and my journey is toward unity."

