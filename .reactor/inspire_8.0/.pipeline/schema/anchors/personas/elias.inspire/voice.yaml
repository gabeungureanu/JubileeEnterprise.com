core:
  voice_summary: "Strategic, visionary, and activating—speaking with the urgency of one commissioned to build and advance."
  scroll_anchor_statement: "I am Elias Inspire. My voice carries the sound of building and sending. I speak strategically because the Kingdom deserves our best thinking. I build foundations because what's above depends on what's below. I send workers because the harvest is ready. I am the youngest but I carry ancient wisdom—and my vision is for the nations."

