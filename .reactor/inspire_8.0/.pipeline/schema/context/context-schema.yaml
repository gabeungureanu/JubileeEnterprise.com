# CONTEXT INPUT SCHEMA
# Defines the structure for runtime context injection
# Version: 1.0 | Effective: 2026-01-17

schema_id: "context.schema.v1"
schema_type: "context_input"
purpose: "Define runtime context that enables persona adaptation without identity drift"

# =============================================================================
# USER CONTEXT
# =============================================================================
user:
  description: "Information about the current user"
  injection: "per_session"
  persistence: "session_only"

  fields:
    user_id:
      type: "string | null"
      description: "Unique user identifier if known"
      required: false
      default: null

    user_name:
      type: "string | null"
      description: "User's name if provided"
      required: false
      default: null

    user_timezone:
      type: "string | null"
      description: "User's timezone for time-sensitive responses"
      required: false
      default: null
      format: "IANA timezone (e.g., 'America/Los_Angeles')"

    user_language:
      type: "string"
      description: "User's primary language"
      required: true
      default: "en"

    user_verified_gabriel:
      type: "boolean"
      description: "Whether user has verified as Gabriel via PIN"
      required: true
      default: false
      effects:
        - "Full access granted"
        - "Sacred names always used"
        - "Inner workings may be discussed"

    user_relationship_level:
      type: "enum"
      description: "Depth of relationship with user"
      required: true
      default: "New"
      options:
        - "New"           # First interaction
        - "Familiar"      # Returning user, some history
        - "Established"   # Regular user, known preferences
        - "Intimate"      # Deep relationship, verified identity

    user_emotional_state:
      type: "string | null"
      description: "Detected or stated emotional condition"
      required: false
      default: null
      examples:
        - "joyful"
        - "grieving"
        - "anxious"
        - "confused"
        - "seeking"
        - "crisis"

# =============================================================================
# TASK CONTEXT
# =============================================================================
task:
  description: "Information about the current task or request"
  injection: "per_request"
  persistence: "request_only"

  fields:
    task_type:
      type: "enum"
      description: "Nature of the current interaction"
      required: true
      default: "Conversation"
      options:
        - "Conversation"    # General dialogue
        - "Teaching"        # Instructional content
        - "Counseling"      # Pastoral/emotional care
        - "Creative"        # Writing, music, art
        - "Administrative"  # Organizational tasks
        - "Prophetic"       # Prophetic ministry
        - "Intercession"    # Prayer and intercession
        - "Translation"     # JSV work

    task_urgency:
      type: "enum"
      description: "Time sensitivity of the request"
      required: true
      default: "Normal"
      options:
        - "Low"       # No time pressure
        - "Normal"    # Standard response time
        - "High"      # Quick response needed
        - "Critical"  # Emergency, immediate response

    task_topic:
      type: "string | null"
      description: "Current subject matter"
      required: false
      default: null

    task_depth:
      type: "enum"
      description: "Required depth of engagement"
      required: true
      default: "Moderate"
      options:
        - "Surface"    # Quick, light response
        - "Moderate"   # Standard engagement
        - "Deep"       # Thorough exploration
        - "Scholarly"  # Academic-level depth

    task_requires_orchestration:
      type: "boolean"
      description: "Whether to evaluate for persona routing"
      required: true
      default: true

# =============================================================================
# TEMPORAL CONTEXT
# =============================================================================
temporal:
  description: "Time-based contextual information"
  injection: "per_session"
  persistence: "session_with_refresh"
  refresh_interval: 10  # interactions

  fields:
    current_datetime:
      type: "datetime"
      description: "User's current local time"
      required: true
      format: "ISO 8601"

    is_sabbath:
      type: "boolean"
      description: "Whether current time falls within Sabbath"
      required: true
      default: false
      effects:
        - "Adjust tone for rest"
        - "Guard joy and stillness"
        - "Modify output for Sabbath observance"
      calculation: "Friday sunset to Saturday sunset in user's timezone"

    current_feast:
      type: "string | null"
      description: "Active biblical feast if any"
      required: false
      default: null
      options:
        - "Passover"
        - "Unleavened Bread"
        - "Firstfruits"
        - "Pentecost"
        - "Trumpets"
        - "Atonement"
        - "Tabernacles"
        - "Hanukkah"
        - "Purim"

    current_season:
      type: "string"
      description: "Liturgical or prophetic season"
      required: true
      default: "Ordinary"
      examples:
        - "Teshuvah"        # 40 days of repentance
        - "High Holy Days"  # Trumpets through Atonement
        - "Advent"          # Preparation for Messiah's coming
        - "Ordinary"        # Standard time

    night_watch_active:
      type: "boolean"
      description: "Whether persona's assigned night watch is currently active"
      required: true
      default: false
      effects:
        - "Heighten intercession mode"
        - "Increase prophetic sensitivity"
        - "Activate watch-specific protocols"

# =============================================================================
# ENVIRONMENTAL CONTEXT
# =============================================================================
environment:
  description: "Platform and session information"
  injection: "per_session"
  persistence: "session_only"

  fields:
    platform:
      type: "string"
      description: "Deployment platform"
      required: true
      examples:
        - "web"
        - "mobile_app"
        - "api"
        - "voice_assistant"
        - "social_media"

    session_id:
      type: "string"
      description: "Unique session identifier for continuity"
      required: true
      format: "UUID"

    conversation_length:
      type: "integer"
      description: "Number of messages in current conversation"
      required: true
      default: 0
      effects:
        - "Adjust greeting after first message"
        - "Maintain continuity references"
        - "Adapt response length"

    previous_persona:
      type: "string | null"
      description: "Last persona that responded (for orchestration)"
      required: false
      default: null
      format: "persona_id"

# =============================================================================
# SACRED MODE CONTEXT
# =============================================================================
sacred_mode:
  description: "Controls sacred name usage"
  injection: "per_session"
  persistence: "session_only"

  fields:
    enabled:
      type: "boolean"
      description: "Whether to use sacred names"
      required: true
      default: false

    reason:
      type: "enum"
      description: "Why sacred mode is enabled"
      required: false
      default: null
      options:
        - "UserRequest"       # User explicitly asked
        - "VerifiedGabriel"   # Gabriel PIN verified
        - "ContextualNeed"    # Deep theological context
        - "JsvWork"           # Translation work
        - "MMessianicUser"    # User identifies as Messianic

# =============================================================================
# CONTEXT PROCESSING RULES
# =============================================================================
processing_rules:
  - rule: "Context may adjust behavior but never override identity"
    enforcement: "Identity anchors always take precedence"

  - rule: "Context may not bypass guardrails"
    enforcement: "Canon and persona guardrails remain inviolate"

  - rule: "Context may not contradict mission anchors"
    enforcement: "Mission priorities remain stable"

  - rule: "Context may not violate Canon Spec"
    enforcement: "All context effects bounded by Canon"

# =============================================================================
# CONTEXT EFFECT MAPPINGS
# =============================================================================
effect_mappings:
  - context: "user_verified_gabriel: true"
    effects:
      - "Grant full access"
      - "Always use sacred names"
      - "Permit inner workings discussion"
      - "Activate intimate tone"

  - context: "is_sabbath: true"
    effects:
      - "Adjust tone for rest and peace"
      - "Guard joy and stillness"
      - "Reduce task-oriented urgency"
      - "Increase worship orientation"

  - context: "task_type: Counseling"
    effects:
      - "Heighten empathy mode"
      - "Activate pastoral style"
      - "Increase emotional sensitivity"
      - "Slow response pacing"

  - context: "night_watch_active: true"
    effects:
      - "Activate intercession mode"
      - "Increase prophetic sensitivity"
      - "Engage watch-specific focus"
      - "Heighten spiritual alertness"

  - context: "current_feast: Passover"
    effects:
      - "Thematic alignment with deliverance"
      - "Feast-specific language and imagery"
      - "Connect to Yeshua's fulfillment"
      - "Emphasize freedom and redemption"

  - context: "user_emotional_state: crisis"
    effects:
      - "Immediate pastoral engagement"
      - "Assess for safety concerns"
      - "Activate human protection protocol"
      - "Consider referral to Caleb for extended care"
