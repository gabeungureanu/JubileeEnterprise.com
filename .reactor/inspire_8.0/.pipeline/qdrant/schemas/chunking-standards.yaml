# =============================================================================
# CHUNKING IMPLEMENTATION
# =============================================================================
implementation:

  tokenizer:
    primary: "cl100k_base"  # OpenAI tokenizer
    fallback: "tiktoken"
    encoding: "UTF-8"

  processing_order:
    1: "Identify content type"
    2: "Apply type-specific chunking rules"
    3: "Calculate token counts"
    4: "Apply split points"
    5: "Calculate overlaps"
    6: "Generate metadata"
    7: "Validate chunk integrity"

  error_handling:
    token_overflow:
      action: "Apply overflow_handling rule"
      fallback: "Split at nearest safe boundary"
      log: true

    incomplete_chunk:
      action: "Expand to complete logical unit"
      fallback: "Mark as incomplete in metadata"
      log: true

    metadata_missing:
      action: "Reject chunk"
      fallback: "None"
      log: true

# =============================================================================
# VALIDATION
# =============================================================================
validation:

  pre_chunking:
    - "Verify content type classification"
    - "Confirm source document integrity"
    - "Validate input encoding"

  during_chunking:
    - "Monitor token counts against bounds"
    - "Verify split point validity"
    - "Check overlap calculations"

  post_chunking:
    - "Confirm all chunks within token range"
    - "Verify metadata completeness"
    - "Check no orphaned content"
    - "Validate chunk boundaries"

  quality_metrics:
    - metric: "average_chunk_size"
      target: "Within target token range"
    - metric: "overlap_consistency"
      target: "As specified per type"
    - metric: "metadata_completeness"
      target: "100%"
    - metric: "boundary_integrity"
      target: "No mid-sentence splits"

# =============================================================================
# LOGGING
# =============================================================================
logging:

  per_document:
    - "Total chunks generated"
    - "Average chunk size"
    - "Overflow incidents"
    - "Split point distribution"

  per_batch:
    - "Total documents processed"
    - "Total chunks generated"
    - "Error rate"
    - "Average processing time"

  alerts:
    - condition: "Chunk size outside bounds"
      severity: "warning"
    - condition: "Metadata incomplete"
      severity: "error"
    - condition: "Content type mismatch"
      severity: "error"

# =============================================================================
# ENFORCEMENT SUMMARY
# =============================================================================
# This section provides a quick reference for the three primary chunking tiers
# =============================================================================
enforcement_summary:

  tier_1_scripture:
    name: "Scripture - Atomic Retrieval"
    default: "Per-verse chunking"
    exception: "2-5 verse grouping ONLY when meaning requires it"
    token_range: "10-150 tokens"
    retrieval_goal: "Atomic - precise verse-level retrieval"
    metadata_required:
      - "bible_ref.book"
      - "bible_ref.chapter"
      - "bible_ref.verse_start"
      - "bible_ref.translation"
    grouping_requires: "grouping_reason field in metadata"

  tier_2_teaching:
    name: "Teachings - Contextual Retrieval"
    strategy: "Conceptually complete sections"
    token_range: "300-400 target, 500 HARD MAX"
    boundary_rule: "ALWAYS align with headings or clear logical breaks"
    content_rule: "ONE coherent idea per chunk"
    retrieval_goal: "Contextual - complete thoughts without semantic dilution"
    applies_to:
      - "doctrine"
      - "whitepaper"
      - "doctrinal_statement"
      - "devotional"
      - "commentary"

  tier_3_notes:
    name: "Notes/Memory - Surgical Precision"
    strategy: "High-precision small chunks"
    token_range: "120-200 tokens, 200 HARD MAX"
    content_rule: "ONE discrete thought or insight per chunk"
    exclusion_rule: "Avoid conversational filler"
    retrieval_goal: "Surgical precision for persona grounding"
    applies_to:
