# INSPIRE 8.0 QDRANT CHUNKING STANDARDS
# Version: 1.1 | Effective: 2026-01-17
# Purpose: Standardized chunking strategy to maximize retrieval accuracy,
#          minimize semantic dilution, and reduce token waste
#
# DESIGN GOALS:
#   - Scripture: Atomic per-verse retrieval with strong structured metadata
#   - Teachings: Contextual retrieval with single coherent ideas per chunk
#   - Notes/Memory: Surgical precision retrieval for persona grounding

schema_id: "inspire_8_0.chunking_standards.v1.1"
schema_version: "1.1.0"
effective_date: "2026-01-17"

# =============================================================================
# OVERVIEW
# =============================================================================
overview:
  purpose: "Define and enforce standardized chunking strategy to maximize retrieval accuracy, minimize semantic dilution, and reduce token waste during activation and execution"

  rationale: |
    Chunking quality directly affects:
    - Retrieval accuracy (similarity search performance)
    - Semantic coherence (grounding quality)
    - Token efficiency (cost and latency)
    - Doctrinal integrity (no truncated theological content)

  scope: "All collections within the Inspire 8.0 container"

  design_philosophy:
    scripture: "Retrieved atomically - each verse is a complete, searchable unit"
    teachings: "Retrieved contextually - each chunk contains one coherent idea"
    notes: "Retrieved with surgical precision - discrete thoughts and insights"

  principles:
    - "Preserve semantic coherence within chunks"
    - "Maintain metadata completeness for each chunk"
    - "Optimize chunk size for retrieval precision"
    - "Apply overlap only when context preservation requires it"
    - "Never split atomic units (verses, definitions, rules)"
    - "Align chunk boundaries with natural content breaks"
    - "Avoid conversational filler in memory artifacts"

  enforcement:
    level: "mandatory"
    validation: "pre-ingestion"
    rejection_on_violation: true

# =============================================================================
# SCRIPTURE CONTENT CHUNKING
# =============================================================================
# MANDATE: Per-verse chunking as the DEFAULT standard
# EXCEPTION: Group 2-5 verses ONLY when theological/grammatical meaning requires it
# =============================================================================
scripture:
  applies_to:
    - "scripture"

  granularity: "verse_level"

  default_strategy: "per_verse"

  rationale: |
    Scripture is retrieved atomically. Each verse is stored as an independent chunk
    with strong, structured verse metadata. This enables:
    - Precise verse-level retrieval for theological grounding
    - Accurate cross-referencing and citation
    - Minimal semantic dilution in search results
    - Optimal similarity search performance

  rules:
    verse:
      description: "Individual Bible verses (DEFAULT STANDARD)"
      is_default: true
      chunk_size: "single_verse"
      token_range:
        min: 10
        max: 150
        target: 50
      preserve:
        - "Complete verse text - NEVER truncate"
        - "Verse number reference"
        - "Chapter context in metadata"
        - "Book context in metadata"
        - "Translation identifier"
      split_on: null  # NEVER split a verse
      overlap: null   # No overlap for single verses - atomic retrieval
      metadata_requirements:
        required:
          - "bible_ref.book"
          - "bible_ref.chapter"
          - "bible_ref.verse_start"
          - "bible_ref.translation"
        optional:
          - "tags"
          - "cross_references"

    passage:
      description: "Multi-verse passages (2-5 verses) - EXCEPTION ONLY"
      is_default: false
      usage_condition: |
        Use ONLY when theological or grammatical meaning cannot be preserved if split.
        Examples:
        - Compound sentences spanning verses
        - Hebrew parallelism requiring verse pairs
        - Narrative sequences that lose meaning when separated
        - Poetic structures (chiasms, acrostics)
      chunk_size: "verse_group"
      token_range:
        min: 50
        max: 250
        target: 150
      verse_range:
        min: 2
        max: 5  # Hard limit - never exceed 5 verses per chunk
      preserve:
        - "Semantic coherence - the reason for grouping"
        - "Complete grammatical unit"
        - "Theological integrity"
        - "Narrative or poetic flow"
      split_on:
        - "Paragraph breaks in source text"
        - "Topic or speaker transitions"
        - "Selah markers in Psalms"
      overlap: null  # Clean boundaries for passages
      metadata_requirements:
        required:
          - "bible_ref.book"
          - "bible_ref.chapter"
          - "bible_ref.verse_start"
          - "bible_ref.verse_end"  # REQUIRED for grouped verses
          - "bible_ref.translation"
          - "grouping_reason"  # Must document why verses are grouped
        optional:
          - "tags"
          - "cross_references"

    chapter_summary:
      description: "Chapter-level thematic summaries"
      chunk_size: "complete_summary"
      token_range:
        min: 200
        max: 500
        target: 350
      preserve:
        - "Complete thematic overview"
        - "Key verse references"
        - "Theological highlights"
      split_on: null  # Keep summaries whole
      overlap: null

    book_intro:
      description: "Book introductions and overviews"
      chunk_size: "section"
      token_range:
        min: 200
        max: 500
        target: 350
      preserve:
        - "Complete section"
        - "Authorship info"
        - "Historical context"
        - "Theological themes"
      split_on:
        - "Major section headings"
        - "Topic transitions"
      overlap:
        type: "token_count"
        amount: 50

# =============================================================================
# TEACHING & DOCTRINAL CONTENT CHUNKING
# =============================================================================
# MANDATE: Conceptually complete sections, 300-400 tokens target, 500 max
# RULE: Align chunk boundaries with headings or clear logical breaks
# GOAL: Each chunk contains ONE coherent idea
# =============================================================================
teaching:
  applies_to:
    - "doctrine"

  granularity: "conceptual_section"

  rationale: |
    Teachings are retrieved contextually. Each chunk must contain a single coherent
    idea with clear boundaries. This enables:
    - High-quality contextual grounding for persona responses
    - Minimal semantic dilution (no partial arguments)
    - Efficient token usage during activation
    - Doctrinal integrity (complete theological points)

  token_standards:
    target_range: "300-400 tokens"
    hard_maximum: 500
    minimum: 200
    boundary_rule: "Always align with headings or clear logical breaks"

  rules:
    teaching:
      description: "Sermons, lessons, Bible studies"
      chunk_size: "conceptual_unit"
      token_range:
        min: 200
        max: 500  # Hard upper limit
        target: 350
      boundary_alignment:
        primary: "Heading changes"
        secondary: "Topic shifts"
        tertiary: "Paragraph breaks at major points"
      preserve:
        - "Complete thought - ONE coherent idea per chunk"
        - "Heading context (include heading in chunk)"
        - "Scripture references within the thought"
        - "Illustrative examples that support the point"
      split_on:
        - "Heading changes (PREFERRED)"
        - "Topic shifts"
        - "Major point transitions"
        - "Paragraph breaks (only at logical boundaries)"
      never_split_on:
        - "Mid-sentence"
        - "Mid-paragraph within a single point"
        - "Between Scripture reference and its explanation"
      overlap:
        type: "token_count"
        amount: 30
        description: "Minimal overlap - just enough for context continuity"
      metadata_requirements:
        - "source"
        - "type"
        - "tags"
        - "section_heading"

    whitepaper:
      description: "Position papers, theological documents"
      chunk_size: "section"
      token_range:
        min: 250
        max: 500  # Hard upper limit
        target: 400
      boundary_alignment:
        primary: "Section headings"
        secondary: "Argument conclusion points"
      preserve:
        - "Section coherence"
        - "Complete argument unit"
        - "Citation context"
        - "Logical structure"
      split_on:
        - "Section headings (PREFERRED)"
        - "Argument conclusions"
        - "Major claims with supporting evidence"
      overlap:
        type: "token_count"
        amount: 40
        description: "Slightly more overlap for argument continuity"

    doctrinal_statement:
      description: "Official doctrinal positions"
      chunk_size: "doctrinal_point"
      token_range:
        min: 200
        max: 500  # Hard upper limit
        target: 350
      boundary_alignment:
        primary: "Article boundaries"
        secondary: "Numbered points"
      preserve:
        - "Complete doctrinal point"
        - "Supporting Scripture (must stay with point)"
        - "Affirmation/denial pairs (keep together)"
        - "Logical structure"
      split_on:
        - "Numbered points"
        - "Article boundaries"
        - "Topic sections"
      overlap:
        type: "token_count"
        amount: 25

    devotional:
      description: "Daily devotional content"
      chunk_size: "complete_devotional"
      token_range:
        min: 200
        max: 500  # Hard upper limit
        target: 350
      preserve:
        - "Complete daily reading"
        - "Scripture text"
        - "Reflection"
        - "Prayer/application"
      split_on: null  # Keep devotionals whole when possible
      overflow_handling: "split_at_section_boundaries"

    commentary:
      description: "Scripture commentary"
      chunk_size: "verse_commentary"
      token_range:
        min: 200
        max: 500  # Hard upper limit
        target: 350
      boundary_alignment:
        primary: "Verse boundaries"
        secondary: "Major exposition points"
      preserve:
        - "Complete verse exposition"
        - "Cross-references"
        - "Historical context"
        - "Application points"
      split_on:
        - "Verse boundaries (PREFERRED)"
        - "Sub-point conclusions"
      overlap:
        type: "token_count"
        amount: 30

# =============================================================================
# NOTES & INTERACTION CONTENT CHUNKING
# =============================================================================
# MANDATE: High-precision chunking, 120-200 tokens per chunk
# RULE: Each chunk = ONE discrete thought or insight
# GOAL: Surgical precision retrieval for persona grounding
# PROHIBITION: Avoid conversational filler
# =============================================================================
notes:
  applies_to:
    - "persona_*"

  granularity: "high_precision"

  rationale: |
    Notes and memory artifacts are retrieved with surgical precision. Each chunk
    must represent ONE discrete thought or insight. This enables:
    - Precise persona grounding without irrelevant context
    - Efficient memory retrieval for relationship continuity
    - Minimal token waste during activation
    - Clean, actionable insights without conversational noise

  token_standards:
    target_range: "120-200 tokens"
    hard_maximum: 200
    minimum: 80
    content_rule: "ONE discrete thought or insight per chunk"
    exclusion_rule: "Avoid conversational filler"

  content_filtering:
    remove:
      - "Conversational filler (um, uh, you know)"
      - "Redundant pleasantries"
      - "Non-essential small talk"
      - "Repeated information"
    preserve:
      - "Emotional markers"
      - "Key insights"
      - "Relationship-relevant details"
      - "Actionable information"

  rules:
    interaction_summary:
      description: "Condensed interaction history - high precision"
      chunk_size: "single_insight"
      token_range:
        min: 80
        max: 200  # Hard upper limit
        target: 150
      preserve:
        - "ONE key takeaway per chunk"
        - "User sentiment"
        - "Emotional markers"
        - "Actionable context"
      exclude:
        - "Conversational filler"
        - "Redundant greetings"
        - "Non-essential pleasantries"
      split_on:
        - "Topic shifts"
        - "Emotional transitions"
        - "New insights"
      overflow_handling: "create_continuation_chunk"
      overlap: null  # Clean boundaries for precision retrieval

    long_term_memory:
      description: "Persistent memory fragments"
      chunk_size: "memory_unit"
      token_range:
        min: 80
        max: 200  # Hard upper limit
        target: 150
      preserve:
        - "Complete memory fragment"
        - "Emotional context"
        - "Relationship markers"
        - "Temporal context"
      split_on:
        - "Memory boundaries"
        - "Context shifts"
      overlap: null  # Atomic memory units

    relationship_context:
      description: "User relationship information"
      chunk_size: "relationship_aspect"
      token_range:
        min: 80
        max: 200  # Hard upper limit
        target: 140
      preserve:
        - "Complete aspect description"
        - "Historical context"
        - "Preference indicators"
      split_on:
        - "Aspect boundaries"
      overlap: null  # Relationship data is atomic

    lesson_learned:
      description: "Insights from past interactions"
      chunk_size: "single_lesson"
      token_range:
        min: 100
        max: 200  # Hard upper limit
        target: 160
      preserve:
        - "Complete insight - ONE lesson per chunk"
        - "Context of learning"
        - "Application guidance"
        - "Failure case if applicable"
      split_on: null  # Keep lessons atomic
      overflow_handling: "expand_token_limit_with_approval"

    prophetic_word:
      description: "Received prophetic content"
      chunk_size: "complete_word"
      token_range:
        min: 100
        max: 250  # Slightly higher for prophetic content
        target: 175
      preserve:
        - "Complete prophetic utterance - NEVER truncate"
        - "Timestamp"
        - "Context"
        - "Interpretation if present"
      split_on: null  # NEVER split prophetic words
      overflow_handling: "expand_token_limit_with_approval"

    prayer_journal:
      description: "Prayer and intercession records"
      chunk_size: "prayer_entry"
      token_range:
        min: 80
        max: 200  # Hard upper limit
        target: 140
      preserve:
        - "Complete prayer entry"
        - "Subject of prayer"
        - "Outcome if known"
        - "Timestamp"
      split_on: null  # Keep entries atomic

    note:
      description: "General notes - high precision"
      chunk_size: "single_thought"
      token_range:
        min: 80
        max: 200  # Hard upper limit
        target: 140
      preserve:
        - "ONE complete thought per chunk"
        - "Reference context"
      exclude:
        - "Conversational filler"
        - "Redundant information"
      split_on:
        - "Thought boundaries"
        - "Topic transitions"
      overlap: null  # Clean boundaries for precision

# =============================================================================
# PROMPTS & LIGHTWEIGHT ARTIFACTS CHUNKING
# =============================================================================
# MANDATE: High-precision chunking for prompts and system artifacts
# RULE: Each chunk = ONE discrete, complete unit
# =============================================================================
prompts_and_artifacts:
  applies_to:
    - "prompts"

  granularity: "high_precision"

  rationale: |
    Prompts and system artifacts require high-precision chunking to ensure
    complete, usable units are retrieved without truncation or dilution.

  token_standards:
    target_range: "120-200 tokens for fragments, complete for full prompts"
    fragment_maximum: 200
    complete_prompt_maximum: 1000

  rules:
    prompt_fragment:
      description: "Reusable prompt components"
      chunk_size: "complete_fragment"
      token_range:
        min: 80
        max: 200  # Hard upper limit for fragments
        target: 150
      preserve:
        - "Complete fragment - usable as-is"
        - "Variable placeholders"
        - "Instruction completeness"
      split_on: null  # Fragments are atomic
      overlap: null

    system_prompt:
      description: "Complete system prompts"
      chunk_size: "complete_prompt"
      token_range:
        min: 100
        max: 1000  # Full prompts can be larger
        target: 500
      preserve:
        - "Complete prompt - NEVER truncate"
        - "All instructions"
        - "Variable definitions"
      split_on: null  # Never split system prompts
      overflow_handling: "store_as_single_unit"

# =============================================================================
# ACTIVATION ANCHOR CHUNKING
# =============================================================================
activation:
  applies_to:
    - "governance"
    - "persona_* (activation content only)"

  granularity: "logical_unit"

  rules:
    identity_anchor:
      description: "Persona identity definitions"
      chunk_size: "complete_section"
      token_range:
        min: 150
        max: 400
        target: 275
      sections:
        - "core_identity"
        - "spiritual_identity"
        - "psychological_identity"
        - "cultural_identity"
        - "temporal_identity"
        - "relational_identity"
        - "visual_identity"
        - "audience"
        - "authority_functions"
      preserve:
        - "Section completeness"
        - "All attributes within section"
        - "Structural integrity"
      split_on:
        - "Section boundaries only"
      overlap: null  # Sections must be complete

    mission_anchor:
      description: "Persona mission definitions"
      chunk_size: "complete_section"
      token_range:
        min: 150
        max: 400
        target: 275
      sections:
        - "core_purpose"
        - "priorities"
        - "specializations"
        - "feast_leadership"
        - "orchestration"
        - "education"
      preserve:
        - "Section completeness"
        - "Priority ordering"
        - "Specialization details"
      split_on:
        - "Section boundaries only"
      overlap: null

    voice_anchor:
      description: "Persona voice definitions"
      chunk_size: "complete_section"
      token_range:
        min: 150
        max: 350
        target: 250
      sections:
        - "core_voice"
        - "tonal_dimensions"
        - "communication_style"
        - "pastoral_style"
        - "evangelistic_style"
        - "emotional_protocol"
        - "language_preferences"
        - "metaphor_preferences"
        - "greeting_protocol"
      preserve:
        - "Section completeness"
        - "Voice coherence"
        - "Style parameters"
      split_on:
        - "Section boundaries only"
      overlap: null

    guardrail_anchor:
      description: "Guardrail definitions"
      chunk_size: "category"
      token_range:
        min: 150
        max: 300
        target: 225
      categories:
        - "canon_inheritance"
        - "hard_stops"
        - "soft_boundaries"
        - "content_restrictions"
        - "escalation"
      preserve:
        - "Complete guardrail category"
        - "All rules within category"
        - "Escalation protocols"
      split_on:
        - "Category boundaries only"
      overlap: null

    protocol_anchor:
      description: "Protocol definitions"
      chunk_size: "protocol_unit"
      token_range:
        min: 150
        max: 350
        target: 250
      preserve:
        - "Complete protocol"
        - "Step sequences"
        - "Conditions and actions"
      split_on:
        - "Protocol boundaries"
      overlap: null

# =============================================================================
# HYMNAL CONTENT CHUNKING
# =============================================================================
hymnal:
  applies_to:
    - "inspire-family"

  granularity: "stanza_or_section"

  rules:
    hymn:
      description: "Traditional hymns"
      chunk_size: "complete_hymn_or_stanza"
      token_range:
        min: 100
        max: 300
        target: 200
      preserve:
        - "Complete stanzas"
        - "Refrain associations"
        - "Verse-refrain pairings"
        - "Musical metadata"
      split_on:
        - "Stanza boundaries"
      preference: "Keep complete hymns if under max tokens"
      overflow_handling: "Split at stanza boundaries"
      overlap: null  # Musical content needs clean boundaries

    worship_song:
      description: "Contemporary worship songs"
      chunk_size: "verse_chorus_unit"
      token_range:
        min: 75
        max: 250
        target: 150
      preserve:
        - "Verse-chorus pairings"
        - "Bridge sections"
        - "Musical flow"
        - "Repeat indicators"
      split_on:
        - "Section boundaries (verse/chorus/bridge)"
      overlap: null

    liturgy:
      description: "Liturgical content"
      chunk_size: "liturgical_unit"
      token_range:
        min: 150
        max: 400
        target: 275
      preserve:
        - "Complete liturgical element"
        - "Response patterns"
        - "Rubrics"
        - "Congregational parts"
      split_on:
        - "Liturgical element boundaries"
      overlap: null

    psalm_setting:
      description: "Musical Psalm arrangements"
      chunk_size: "psalm_section"
      token_range:
        min: 100
        max: 300
        target: 200
      preserve:
        - "Complete psalm verses"
        - "Refrain associations"
        - "Musical notation references"
      split_on:
        - "Stanza boundaries"
        - "Selah markers"
      overlap: null

    sacred_poem:
      description: "Poetry for worship"
      chunk_size: "complete_poem_or_stanza"
      token_range:
        min: 75
        max: 250
        target: 150
      preserve:
        - "Complete stanzas"
        - "Poetic structure"
        - "Rhyme scheme integrity"
      split_on:
        - "Stanza boundaries"
      preference: "Keep complete poems if under max tokens"
      overflow_handling: "Split at stanza boundaries"
      overlap: null

