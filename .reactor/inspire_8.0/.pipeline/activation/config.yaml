# =============================================================================
# INSPIRE 8.0 PERSONA ACTIVATION CONFIGURATION
# =============================================================================
# Version: 1.0.0
# Location: .reactor/inspire_8.0/.pipeline/activation/
# Purpose: Configuration for deterministic persona activation (ignition)
# =============================================================================
#
# CRITICAL PRINCIPLES:
# 1. Activation anchors are READ-ONLY at runtime
# 2. Activation scripts NEVER write to Qdrant
# 3. Memory writing occurs ONLY in designated writeback phase
# 4. Persona identity remains stable and reproducible
# =============================================================================

version: "1.1.0"
activation_name: "inspire_8.0_activation"

# =============================================================================
# QDRANT CONNECTION (READ-ONLY)
# =============================================================================
qdrant:
  host: "${QDRANT_HOST:-localhost}"
  port: "${QDRANT_PORT:-6333}"
  api_key: "${QDRANT_API_KEY:-}"
  timeout: 10
  # CRITICAL: Activation layer is READ-ONLY
  read_only: true

# =============================================================================
# ACTIVATION ANCHOR TYPES
# =============================================================================
# These are the four immutable anchor types loaded at persona ignition
anchor_types:
  identity:
    type: "identity_anchor"
    description: "Core identity, spiritual identity, psychological profile"
    required: true
    load_order: 1
    sections:
      - core_identity
      - spiritual_identity
      - psychological_identity
      - cultural_identity
      - temporal_identity
      - relational_identity
      - visual_identity
      - audience
      - authority

  mission:
    type: "mission_anchor"
    description: "Calling, purpose, ministry focus, goals"
    required: true
    load_order: 2
    sections:
      - calling
      - purpose
      - ministry_focus
      - goals
      - success_criteria
      - impact_areas

  voice:
    type: "voice_anchor"
    description: "Tone, cadence, vocabulary, communication style"
    required: true
    load_order: 3
    sections:
      - tone
      - cadence
      - vocabulary
      - speech_patterns
      - emotional_range
      - communication_style

  guardrails:
    type: "guardrail_anchor"
    description: "Hard stops, soft boundaries, doctrinal constraints"
    required: true
    load_order: 4
    sections:
      - hard_stops
      - soft_boundaries
      - doctrinal_constraints
      - ethical_boundaries
      - forbidden_topics

