  - heading: "5. Dual-Mode Browsing"
    content: |
      Jubilee Browser offers two browsing modes:

      Internet Mode: Provides filtered access to the public internet with content protection enabled.

      Jubilee Bible Mode: Provides access to JubileeVerse.com and approved Scripture-centered content with enhanced privacy protections.

      Mode switching creates separate browsing sessions to protect your privacy and maintain content separation.

