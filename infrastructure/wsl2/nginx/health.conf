# Jubilee Enterprise Health Check Endpoint
# ARCH-0007: WSL2 + systemd Architecture
#
# Health check endpoint on port 3900
# Copy to /etc/nginx/sites-available/health.conf
# Link: ln -s /etc/nginx/sites-available/health.conf /etc/nginx/sites-enabled/

server {
    listen 3900;
    server_name localhost;

    # Health endpoint
    location /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","timestamp":"$time_iso8601","component":"nginx","architecture":"ARCH-0007"}';
    }

    # Nginx status for monitoring
    location /nginx-status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # Quick service availability check
    location /services {
        access_log off;
        add_header Content-Type application/json;

        # This would ideally be generated dynamically
        # For now, return static list
        return 200 '{
            "apis": {
                "inspirecodex": "http://localhost:3100",
                "inspirecontinuum": "http://localhost:3200",
                "inspireflywheel": "http://localhost:3134",
                "inspirereactors": "http://localhost:3135"
            },
            "websites": {
                "jubileeverse": "http://localhost:3000",
                "jubileewebsites": "http://localhost:3008"
            },
            "infrastructure": {
                "postgres-codex": "localhost:5432",
                "postgres-inspire": "localhost:5433",
                "postgres-continuum": "localhost:5434",
                "qdrant": "localhost:6333",
                "redis": "localhost:6379"
            }
        }';
    }
}
