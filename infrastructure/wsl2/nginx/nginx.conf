# Jubilee Enterprise Nginx Configuration
# ARCH-0007: WSL2 + systemd Architecture
#
# Main Nginx configuration for reverse proxy.
# Provides zero-downtime restarts and health endpoints.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ============================================
    # Basic Settings
    # ============================================

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================
    # SSL Settings (for future HTTPS termination)
    # ============================================

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ============================================
    # Logging
    # ============================================

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ============================================
    # Gzip Compression
    # ============================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml application/atom+xml image/svg+xml;

    # ============================================
    # Rate Limiting
    # ============================================

    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=website:10m rate=50r/s;

    # ============================================
    # Upstream Definitions
    # ============================================

    include /etc/nginx/upstreams/*.conf;

    # ============================================
    # Virtual Hosts
    # ============================================

    include /etc/nginx/sites-enabled/*;
}
