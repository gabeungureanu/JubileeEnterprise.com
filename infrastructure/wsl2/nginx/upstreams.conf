# Jubilee Enterprise Upstream Definitions
# ARCH-0007: WSL2 + systemd Architecture
#
# Define all upstream servers for load balancing and health checks.
# Copy to /etc/nginx/upstreams/jubilee.conf

# ============================================
# API Upstreams (Higher priority, more connections)
# ============================================

upstream inspirecodex-api {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream inspirecontinuum-api {
    server 127.0.0.1:3200;
    keepalive 32;
}

upstream inspireflywheel-api {
    server 127.0.0.1:3134;
    keepalive 16;
}

upstream inspirereactors-api {
    server 127.0.0.1:3135;
    keepalive 16;
}

