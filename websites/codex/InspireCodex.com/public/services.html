<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jubilee Platform - Service Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #30363d;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #58a6ff;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-link {
            color: #8b949e;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-link:hover {
            color: #c9d1d9;
            background-color: #21262d;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }

        .tab {
            padding: 10px 20px;
            background-color: transparent;
            border: none;
            color: #8b949e;
            cursor: pointer;
            border-radius: 6px 6px 0 0;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .tab:hover {
            background-color: #21262d;
            color: #c9d1d9;
        }

        .tab.active {
            background-color: #21262d;
            color: #58a6ff;
            border-bottom: 2px solid #58a6ff;
        }

        .tab-count {
            background-color: #30363d;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-left: 6px;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 15px;
        }

        .service-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.2s;
        }

        .service-card:hover {
            border-color: #58a6ff;
        }

        .service-card.disabled {
            opacity: 0.6;
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .service-name {
            font-size: 1rem;
            font-weight: 600;
            color: #c9d1d9;
        }

        .service-description {
            font-size: 0.8rem;
            color: #8b949e;
            margin-top: 2px;
        }

        .service-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-dot.enabled {
            background-color: #3fb950;
            box-shadow: 0 0 6px #3fb950;
        }

        .status-dot.disabled {
            background-color: #f85149;
        }

        .status-label {
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .service-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .detail-item {
            background-color: #0d1117;
            padding: 8px 12px;
            border-radius: 4px;
        }

        .detail-label {
            font-size: 0.7rem;
            color: #8b949e;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .detail-value {
            font-size: 0.9rem;
            color: #c9d1d9;
        }

        .detail-value input {
            width: 100%;
            background-color: transparent;
            border: none;
            color: #c9d1d9;
            font-size: 0.9rem;
            padding: 0;
        }

        .detail-value input:focus {
            outline: none;
            border-bottom: 1px solid #58a6ff;
        }

        .service-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 6px 12px;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #21262d;
            color: #c9d1d9;
        }

        .btn:hover {
            background-color: #30363d;
        }

        .btn-primary {
            background-color: #238636;
            border-color: #238636;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2ea043;
        }

        .btn-danger {
            background-color: transparent;
            border-color: #f85149;
            color: #f85149;
        }

        .btn-danger:hover {
            background-color: #f8514933;
        }

        .btn-warning {
            background-color: transparent;
            border-color: #d29922;
            color: #d29922;
        }

        .btn-warning:hover {
            background-color: #d2992233;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background-color: #30363d;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .toggle-switch.active {
            background-color: #238636;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background-color: #c9d1d9;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform 0.2s;
        }

        .toggle-switch.active::after {
            transform: translateX(20px);
        }

        .health-section {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .health-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .health-title {
            font-size: 1rem;
            color: #58a6ff;
        }

        .health-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            background-color: #0d1117;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .health-status.online {
            color: #3fb950;
        }

        .health-status.offline {
            color: #f85149;
        }

        .health-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .health-stat {
            text-align: center;
        }

        .health-stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #c9d1d9;
        }

        .health-stat-label {
            font-size: 0.75rem;
            color: #8b949e;
            text-transform: uppercase;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            background-color: #238636;
        }

        .toast.error {
            background-color: #f85149;
        }

        .toast.warning {
            background-color: #d29922;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            transform: scale(0.9);
            transition: transform 0.2s;
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.2rem;
            color: #c9d1d9;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 5px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 0.9rem;
        }

        .form-input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .summary-bar {
            display: flex;
            gap: 20px;
            padding: 15px 20px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .summary-count {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .summary-label {
            font-size: 0.85rem;
            color: #8b949e;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #30363d;
            text-align: center;
            color: #8b949e;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Jubilee Platform - Service Management</h1>
            <span style="color: #8b949e; font-size: 0.85rem;">Inspire 8.0 Windows Services Configuration</span>
        </div>
        <div class="header-actions">
            <a href="/" class="nav-link">Dashboard</a>
            <button class="btn btn-primary" onclick="reloadAllServices()">Reload All Services</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="websites" onclick="switchTab('websites')">
            Websites <span class="tab-count" id="websites-count">0</span>
        </button>
        <button class="tab" data-tab="api" onclick="switchTab('api')">
            Web APIs <span class="tab-count" id="api-count">0</span>
        </button>
        <button class="tab" data-tab="docker" onclick="switchTab('docker')">
            Docker <span class="tab-count" id="docker-count">0</span>
        </button>
    </div>

    <div id="health-section" class="health-section" style="display: none;">
        <div class="health-header">
            <span class="health-title">Service Manager Health</span>
            <div class="health-status" id="manager-status">
                <span class="status-dot"></span>
                <span>Checking...</span>
            </div>
        </div>
        <div class="health-stats" id="health-stats"></div>
    </div>

    <div class="summary-bar" id="summary-bar">
        <div class="summary-item">
            <span class="summary-count" id="enabled-count" style="color: #3fb950;">0</span>
            <span class="summary-label">Enabled</span>
        </div>
        <div class="summary-item">
            <span class="summary-count" id="disabled-count" style="color: #f85149;">0</span>
            <span class="summary-label">Disabled</span>
        </div>
        <div class="summary-item">
            <span class="summary-count" id="total-workers" style="color: #58a6ff;">0</span>
            <span class="summary-label">Total Workers</span>
        </div>
    </div>

    <div id="content">
        <div class="loading">
            <div class="spinner"></div>
        </div>
    </div>

    <div class="footer">
        <p>InspireCodex Service Management | Inspire 8.0</p>
    </div>

    <div class="toast" id="toast"></div>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Edit Service</h3>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Dynamic content -->
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveServiceChanges()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        let servicesData = {};
        let currentTab = 'websites';
        let editingService = null;

        async function loadServices() {
            try {
                const response = await fetch('/api/v1/services');
                const data = await response.json();

                if (data.success) {
                    servicesData = data.configs;
                    updateTabCounts();
                    renderServices();
                    loadHealthStatus();
                } else {
                    showToast('Failed to load services', 'error');
                }
            } catch (error) {
                console.error('Error loading services:', error);
                showToast('Error loading services: ' + error.message, 'error');
            }
        }

        function updateTabCounts() {
            if (servicesData.websites) {
                document.getElementById('websites-count').textContent = servicesData.websites.services.length;
            }
            if (servicesData.api) {
                document.getElementById('api-count').textContent = servicesData.api.services.length;
            }
            if (servicesData.docker) {
                document.getElementById('docker-count').textContent = servicesData.docker.containers.length;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            renderServices();
            loadHealthStatus();
        }

        async function loadHealthStatus() {
            const healthSection = document.getElementById('health-section');
            const statusDiv = document.getElementById('manager-status');
            const statsDiv = document.getElementById('health-stats');

            try {
                const response = await fetch(`/api/v1/services/health/${currentTab}`);
                const data = await response.json();

                if (data.success && data.data) {
                    healthSection.style.display = 'block';
                    statusDiv.className = 'health-status online';
                    statusDiv.innerHTML = `<span class="status-dot enabled"></span><span>Online</span>`;

                    const managerData = data.data.manager || {};
                    const services = data.data.services || [];

                    statsDiv.innerHTML = `
                        <div class="health-stat">
                            <div class="health-stat-value">${managerData.pid || 'N/A'}</div>
                            <div class="health-stat-label">Manager PID</div>
                        </div>
                        <div class="health-stat">
                            <div class="health-stat-value">${formatUptime(managerData.uptime || 0)}</div>
                            <div class="health-stat-label">Uptime</div>
                        </div>
                        <div class="health-stat">
                            <div class="health-stat-value">${services.length}</div>
                            <div class="health-stat-label">Running Services</div>
                        </div>
                        <div class="health-stat">
                            <div class="health-stat-value">${services.reduce((sum, s) => sum + (s.workers || 1), 0)}</div>
                            <div class="health-stat-label">Active Workers</div>
                        </div>
                    `;
                } else {
                    healthSection.style.display = 'block';
                    statusDiv.className = 'health-status offline';
                    statusDiv.innerHTML = `<span class="status-dot disabled"></span><span>Offline</span>`;
                    statsDiv.innerHTML = '<p style="color: #8b949e; text-align: center;">Service manager not running</p>';
                }
            } catch (error) {
                healthSection.style.display = 'block';
                statusDiv.className = 'health-status offline';
                statusDiv.innerHTML = `<span class="status-dot disabled"></span><span>Error</span>`;
                statsDiv.innerHTML = `<p style="color: #f85149; text-align: center;">${error.message}</p>`;
            }
        }

        function formatUptime(seconds) {
            if (!seconds) return '0s';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            if (hours > 0) return `${hours}h ${minutes}m`;
            if (minutes > 0) return `${minutes}m ${secs}s`;
            return `${secs}s`;
        }

        function renderServices() {
            const content = document.getElementById('content');
            let services = [];
            let isDocker = currentTab === 'docker';

            if (currentTab === 'websites' && servicesData.websites) {
                services = servicesData.websites.services;
            } else if (currentTab === 'api' && servicesData.api) {
                services = servicesData.api.services;
            } else if (currentTab === 'docker' && servicesData.docker) {
                services = servicesData.docker.containers;
            }

            // Update summary
            const enabled = services.filter(s => s.enabled !== false).length;
            const disabled = services.filter(s => s.enabled === false).length;
            const totalWorkers = services.reduce((sum, s) => sum + (s.workers || 1), 0);

            document.getElementById('enabled-count').textContent = enabled;
            document.getElementById('disabled-count').textContent = disabled;
            document.getElementById('total-workers').textContent = isDocker ? 'N/A' : totalWorkers;

            if (services.length === 0) {
                content.innerHTML = '<p style="text-align: center; color: #8b949e; padding: 40px;">No services configured</p>';
                return;
            }

            let html = '<div class="service-grid">';

            for (const service of services) {
                const isEnabled = service.enabled !== false;
                html += `
                    <div class="service-card ${isEnabled ? '' : 'disabled'}">
                        <div class="service-header">
                            <div>
                                <div class="service-name">${service.name}</div>
                                <div class="service-description">${service.description || ''}</div>
                            </div>
                            <div class="service-status">
                                <div class="toggle-switch ${isEnabled ? 'active' : ''}"
                                     onclick="toggleService('${service.name}', ${!isEnabled})"></div>
                            </div>
                        </div>
                        <div class="service-details">
                            ${isDocker ? `
                                <div class="detail-item">
                                    <div class="detail-label">Image</div>
                                    <div class="detail-value">${service.image}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Port</div>
                                    <div class="detail-value">${service.port}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Restart</div>
                                    <div class="detail-value">${service.restartPolicy || 'always'}</div>
                                </div>
                            ` : `
                                <div class="detail-item">
                                    <div class="detail-label">Port</div>
                                    <div class="detail-value">${service.port}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Workers</div>
                                    <div class="detail-value">${service.workers || 1}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Script</div>
                                    <div class="detail-value">${service.script}</div>
                                </div>
                            `}
                        </div>
                        <div class="service-actions">
                            <button class="btn" onclick="editService('${service.name}')">Edit</button>
                            ${!isDocker ? `
                                <button class="btn btn-warning" onclick="setWorkers('${service.name}', ${service.workers || 1})">
                                    Set Workers
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            content.innerHTML = html;
        }

        async function toggleService(serviceName, enabled) {
            try {
                const response = await fetch(`/api/v1/services/${currentTab}/${serviceName}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });

                const data = await response.json();

                if (data.success) {
                    showToast(`${serviceName} ${enabled ? 'enabled' : 'disabled'}`, 'success');
                    await loadServices();
                } else {
                    showToast('Failed to update service', 'error');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        function editService(serviceName) {
            const services = currentTab === 'docker'
                ? servicesData.docker.containers
                : (currentTab === 'api' ? servicesData.api.services : servicesData.websites.services);

            const service = services.find(s => s.name === serviceName);
            if (!service) return;

            editingService = serviceName;
            const isDocker = currentTab === 'docker';

            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <div class="form-group">
                    <label class="form-label">Service Name</label>
                    <input type="text" class="form-input" id="edit-name" value="${service.name}" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <input type="text" class="form-input" id="edit-description" value="${service.description || ''}">
                </div>
                <div class="form-group">
                    <label class="form-label">Port</label>
                    <input type="number" class="form-input" id="edit-port" value="${service.port}">
                </div>
                ${!isDocker ? `
                    <div class="form-group">
                        <label class="form-label">Workers</label>
                        <input type="number" class="form-input" id="edit-workers" value="${service.workers || 1}" min="1" max="64">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Script</label>
                        <input type="text" class="form-input" id="edit-script" value="${service.script}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Working Directory</label>
                        <input type="text" class="form-input" id="edit-cwd" value="${service.cwd}">
                    </div>
                ` : `
                    <div class="form-group">
                        <label class="form-label">Docker Image</label>
                        <input type="text" class="form-input" id="edit-image" value="${service.image}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Restart Policy</label>
                        <select class="form-input" id="edit-restart">
                            <option value="always" ${service.restartPolicy === 'always' ? 'selected' : ''}>always</option>
                            <option value="unless-stopped" ${service.restartPolicy === 'unless-stopped' ? 'selected' : ''}>unless-stopped</option>
                            <option value="on-failure" ${service.restartPolicy === 'on-failure' ? 'selected' : ''}>on-failure</option>
                            <option value="no" ${service.restartPolicy === 'no' ? 'selected' : ''}>no</option>
                        </select>
                    </div>
                `}
            `;

            document.getElementById('edit-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.remove('show');
            editingService = null;
        }

        async function saveServiceChanges() {
            if (!editingService) return;

            const isDocker = currentTab === 'docker';
            const updates = {
                description: document.getElementById('edit-description').value,
                port: parseInt(document.getElementById('edit-port').value)
            };

            if (!isDocker) {
                updates.workers = parseInt(document.getElementById('edit-workers').value);
                updates.script = document.getElementById('edit-script').value;
                updates.cwd = document.getElementById('edit-cwd').value;
            } else {
                updates.image = document.getElementById('edit-image').value;
                updates.restartPolicy = document.getElementById('edit-restart').value;
            }

            try {
                const response = await fetch(`/api/v1/services/${currentTab}/${editingService}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updates)
                });

                const data = await response.json();

                if (data.success) {
                    showToast('Service updated successfully', 'success');
                    closeModal();
                    await loadServices();
                } else {
                    showToast('Failed to update service', 'error');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        async function setWorkers(serviceName, currentWorkers) {
            const newWorkers = prompt(`Set workers for ${serviceName}:`, currentWorkers);
            if (newWorkers === null) return;

            const workers = parseInt(newWorkers);
            if (isNaN(workers) || workers < 1 || workers > 64) {
                showToast('Workers must be between 1 and 64', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/v1/services/${currentTab}/${serviceName}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ workers })
                });

                const data = await response.json();

                if (data.success) {
                    showToast(`Workers set to ${workers} for ${serviceName}`, 'success');
                    await loadServices();
                } else {
                    showToast('Failed to update workers', 'error');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        async function reloadAllServices() {
            if (!confirm('This will reload all services. Continue?')) return;

            try {
                const types = ['websites', 'api', 'docker'];
                for (const type of types) {
                    await fetch(`/api/v1/services/${type}/reload`, { method: 'POST' });
                }
                showToast('Reload triggered for all services', 'success');
            } catch (error) {
                showToast('Error triggering reload: ' + error.message, 'error');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Auto-refresh every 30 seconds
        setInterval(() => {
            loadHealthStatus();
        }, 30000);

        // Initial load
        loadServices();
    </script>
</body>
</html>
