<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results - JubileeSearch</title>
  <meta name="description" content="Search results from JubileeSearch">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="/images/personas/jubilee.png">
  <link rel="apple-touch-icon" href="/images/personas/jubilee.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="results-container">
    <!-- Header with Search -->
    <header class="results-header">
      <div class="results-header-inner">
        <a href="/" class="results-logo">
          Jubilee<span class="highlight">Search</span>
        </a>
        <div class="results-search-box search-wrapper">
          <form id="search-form" action="/search" method="GET">
            <div class="search-box">
              <input
                type="text"
                id="search-input"
                name="q"
                class="search-input"
                placeholder="Search..."
                autocomplete="off"
              >
              <div class="search-actions">
                <button type="submit" class="voice-button" title="Search">
                  <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </header>

    <!-- Search Stats -->
    <div id="stats" class="results-stats"></div>

    <!-- Loading Indicator -->
    <div id="loading" class="loading" style="display: none;">
      <div class="loading-spinner"></div>
    </div>

    <!-- Search Results -->
    <main id="results" class="results-list">
      <!-- Results will be rendered here by JavaScript -->
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
