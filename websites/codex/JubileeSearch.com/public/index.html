<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JubileeSearch - Faith-Based Search</title>
  <meta name="description" content="Search the Bible, devotionals, and faith-based content with JubileeSearch">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="/images/personas/jubilee.png">
  <link rel="apple-touch-icon" href="/images/personas/jubilee.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="home-container">
    <!-- Avatar -->
    <div class="avatar-container">
      <div class="avatar-wrapper">
        <img src="/images/personas/jubilee.png" alt="Jubilee" class="avatar-image">
      </div>
    </div>

    <!-- Logo -->
    <div class="logo-container">
      <h1 class="main-logo">Jubilee<span class="highlight">Search</span><span class="dotcom">.com</span></h1>
    </div>

    <!-- Search Box -->
    <div class="search-wrapper">
      <form id="search-form" action="/search" method="GET">
        <div class="search-box">
          <input
            type="text"
            id="search-input"
            name="q"
            class="search-input"
            placeholder="Search the web..."
            autocomplete="off"
            autofocus
          >
          <div class="search-actions">
            <button type="submit" class="voice-button" title="Search">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Search Buttons -->
    <div class="button-container">
      <button type="button" class="search-button" onclick="window.location.href='/search?q=verse of the day'">
        Verse of the Day
      </button>
      <button type="button" class="search-button" onclick="window.location.href='/search?q=daily devotional'">
        Daily Devotional
      </button>
      <button type="button" class="search-button" onclick="window.location.href='/search?q=daily prayer'">
        Daily Prayer
      </button>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-links">
      <div>
        <a href="https://jubileeenterprise.com">JubileeEnterprise.com</a>
      </div>
      <div>
        <a href="https://jubileeinspire.com">JubileeInspire</a>
        <span style="color: #555; margin: 0 8px;">|</span>
        <a href="https://jubileeverse.com">JubileeVerse</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
