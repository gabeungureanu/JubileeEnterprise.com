// ============= // Flip Book       

        function previousPage(position) {
        var actualPage = document.getElementById(`page-${position}`);
        var prevPage = document.getElementById(`page-${position - 1}`);

        if (prevPage) {
            var zActual = getComputedStyle(actualPage).zIndex;
            var zPrev = getComputedStyle(prevPage).zIndex;
            let leftElement = actualPage.querySelector('.left-img');
            let rightElement = prevPage.querySelector('.right-img');
            leftElement.classList.toggle('rotate-prev');
            rightElement.classList.toggle('rotate-next');
            setTimeout(function() {
                actualPage.style.zIndex = zPrev;
                prevPage.style.zIndex = zActual;
            }, 50)
        }
    }

    function nextPage(position) {
        var actualPage = document.getElementById(`page-${position}`);
        var nextPage = document.getElementById(`page-${position + 1}`);

        if (nextPage) {
            var zActual = getComputedStyle(actualPage).zIndex;
            var zNext = getComputedStyle(nextPage).zIndex;
            let rightElement = actualPage.querySelector('.right-img');
            let leftElement = nextPage.querySelector('.left-img');
            rightElement.classList.toggle('rotate-next');
            leftElement.classList.toggle('rotate-prev');
            setTimeout(function() {
                nextPage.style.zIndex = zActual;
            }, 150)
            setTimeout(function() {
                actualPage.style.zIndex = zNext;
            }, 400)
        }
    }

        // Music Player
        
        
$(document).ready(function() {
  
  let currentPlayer = null;

function createAudioPlayer(container, file) {
  const player = new AudioPlayer({
    element: container,
    file: file,
    width: 500,
    amplify: 1,
    scaleFactor: 60
  });

  // Override play method to stop other custom players and footer audio
  const originalPlay = player.play.bind(player);
  player.play = function () {
    if (currentPlayer && currentPlayer !== player) {
      currentPlayer.pause();
    }

    // Reset other play button classes
    if (player.element === "#playerContainer") {
      $("#ac-play-btn2").removeClass("ac-playing");
      $("#ac-play-btn3").removeClass("ac-playing");
    } else if (player.element === "#playerContainer2") {
      $("#ac-play-btn1").removeClass("ac-playing");
      $("#ac-play-btn3").removeClass("ac-playing");
    } else {
      $("#ac-play-btn1").removeClass("ac-playing");
      $("#ac-play-btn2").removeClass("ac-playing");
    }

    // Stop footer audio if it's playing
    const footerAudio = document.getElementById("FooterAudioPlayer");
    if (!footerAudio.paused) {
      footerAudio.pause();
     // footerAudio.currentTime = 0;
    }

    currentPlayer = player;
    originalPlay();
  };

  return player;
}

// Create players
const player1 = createAudioPlayer("#playerContainer", "https://s3-us-west-2.amazonaws.com/s.cdpn.io/616095/drumsolo.mp3");
const player2 = createAudioPlayer("#playerContainer2", "https://jewel998.github.io/playlist/music/NovoAmor-StateLines.mp3");
const player3 = createAudioPlayer("#playerContainer3", "https://jewel998.github.io/playlist/music/Daughter-Youth.mp3");

// ➕ NEW: Stop all custom players when FooterAudioPlayer plays
document.getElementById("FooterAudioPlayer").addEventListener("play", () => {
  if (currentPlayer) {
    currentPlayer.pause();
    currentPlayer = null;
  }

  // Remove play classes from all custom buttons
  $("#ac-play-btn1").removeClass("ac-playing");
  $("#ac-play-btn2").removeClass("ac-playing");
  $("#ac-play-btn3").removeClass("ac-playing");
});


});
